<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>별과 우주 디펜스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Silkscreen&display=swap" rel="stylesheet">
<style>
/* Layout: 우주 관제실 — 왼쪽은 7×7 전장과 그 아래 유닛 카드, 오른쪽은 유닛 정보·조합 콘솔 (한 화면 고정, 좁으면 세로로 쌓임) */
:root{
  --void:#05081a; --deck:#0c1230; --deck2:#121b42; --rule:#25316a;
  --ink:#e9edff; --dim:#929dcc; --star:#ffd45e; --alarm:#ff5d6c; --fuse:#5fe7a8; --sky:#7cc0ff;
  --f-disp:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'Silkscreen',ui-monospace,'Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:14px;word-break:keep-all;overflow-wrap:break-word;line-break:strict;
  background:radial-gradient(1100px 600px at 12% -12%,rgba(122,60,255,.17),transparent 60%),radial-gradient(900px 520px at 100% 112%,rgba(31,200,200,.10),transparent 60%),var(--void)}
.app{min-height:100%;max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
button:disabled{opacity:.42;cursor:not-allowed}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px;padding:8px 12px;border:1px solid var(--rule);border-radius:10px;background:linear-gradient(180deg,var(--deck2),var(--deck))}
.brand{margin:0;font-family:var(--f-disp);font-weight:400;font-size:24px;line-height:1;letter-spacing:.01em;white-space:nowrap}
.brand span{color:var(--star)}
.hstat{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.lab{font-size:12px;color:var(--dim)}
.num{font-family:var(--f-num);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:var(--dim)}
.meter{display:inline-block;align-self:center;width:72px;height:6px;border-radius:3px;background:#1a2350;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--fuse);transition:width .25s,background .25s}
.gem{display:inline-block;align-self:center;width:16px;height:16px;background:var(--star);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.res .num{color:var(--star)}
.tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px}
.tbtn,.mini{background:#16204a;border:1px solid var(--rule);border-radius:7px;padding:5px 10px;font-size:13px;line-height:1.2}
.tbtn.on{background:#22336e;border-color:#4560b8}
.tbtn:hover:not(:disabled),.mini:hover:not(:disabled){border-color:#5a74cc}
.mini{padding:3px 8px;font-size:12px}
.seg{display:flex}
.seg .tbtn{border-radius:0;margin-left:-1px}
.seg .tbtn:first-child{border-radius:7px 0 0 7px;margin-left:0}
.seg .tbtn:last-child{border-radius:0 7px 7px 0}

/* Stage */
.stage{display:flex;gap:14px;align-items:flex-start;justify-content:center}
.field{display:flex;flex-direction:column;gap:8px;flex:none;min-width:0}
.board{position:relative;width:520px;height:520px;max-width:100%;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:#070a1d}
.board canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:manipulation}
.toast{position:absolute;left:50%;top:max(10px,13%);transform:translate(-50%,-6px);max-width:90%;padding:6px 14px;border-radius:999px;background:rgba(10,14,40,.88);border:1px solid var(--rule);font-size:13px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(255,40,60,0) 45%,rgba(255,40,60,.5) 100%);animation:dangerPulse .5s ease-in-out infinite alternate;will-change:opacity}
.danger{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:92%;white-space:nowrap;padding:7px 16px;border:1px solid var(--alarm);border-radius:999px;background:rgba(70,8,20,.92);color:#ffd6da;font-size:14px;text-align:center;pointer-events:none;animation:dangerPulse .8s ease-in-out infinite alternate}
.danger b{font-family:var(--f-disp);font-weight:400;font-size:18px;color:#ff8a96;margin-right:4px}
@keyframes dangerPulse{from{opacity:1}to{opacity:.55}}
.num.hot{color:var(--alarm)}
.toast.gold{border-color:var(--star);color:var(--star)}
.toast.alarm{border-color:var(--alarm);color:#ffd0d4}
.toast.ok{border-color:var(--fuse);color:#d4ffe9}

/* Shop */
.shop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 100px;gap:8px}
.card{display:grid;grid-template-columns:1fr;grid-template-rows:auto auto auto;align-content:center;justify-items:center;row-gap:3px;text-align:center;min-width:0;min-height:96px;padding:8px 6px;border:1px solid #2c3a7a;border-radius:9px;background:linear-gradient(180deg,#16204c,#0e1636);transition:transform .12s,border-color .12s}
.card img{width:48px;height:48px}
.cn{font-family:var(--f-disp);font-size:18px;line-height:1.1;max-width:100%;overflow-wrap:normal;white-space:nowrap}
.ck{font-size:12px;color:var(--dim);line-height:1.3}
.cp{font-size:13px;color:var(--star)}
.card:hover:not(:disabled){border-color:var(--star);transform:translateY(-2px)}
.card.picking{border-color:var(--fuse);box-shadow:0 0 0 2px rgba(95,231,168,.35)}
.card.sold .cp{color:var(--dim)}
.side{display:grid;grid-template-rows:auto 1fr;gap:6px;min-width:0}
.atk-up{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:5px 4px;border:1px solid #7a5a1c;border-radius:9px;background:#221a08;color:#ffe9a6;font-size:13px;line-height:1.2;text-align:center}
.atk-up span{white-space:nowrap;line-height:1.2}
.atk-up .al1{font-size:12px;color:#d8c48a}
.atk-up .al2{font-family:var(--f-num);font-size:16px;color:#fff3c8}
.atk-up .al3{font-size:11px;color:var(--star)}
.reroll{padding:6px 4px}
.atk-up:hover:not(:disabled){border-color:var(--star)}
.reroll{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px dashed #3b4c95;border-radius:9px;background:#0e1636;font-size:15px}
.reroll em{font-style:normal;font-size:12px;color:var(--star)}
.reroll:hover:not(:disabled){border-color:var(--star)}
.empty-shop{grid-column:1/5;display:flex;align-items:center;justify-content:center;min-height:92px;border:1px dashed var(--rule);border-radius:9px;color:var(--dim);font-size:13px}

/* Panel */
.rail{display:flex;flex-direction:column;gap:8px;width:340px;flex:none;min-width:0}
.panel{width:100%;flex:none;padding:14px;border:1px solid var(--rule);border-radius:10px;background:var(--deck);overflow:auto}
.eyebrow{margin:0 0 4px;font-size:11px;letter-spacing:.12em;color:var(--dim)}
.panel h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:26px;line-height:1.1;text-wrap:balance}
.panel h3{margin:16px 0 8px;font-size:12px;letter-spacing:.08em;color:var(--dim);font-weight:500}
.uhead{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center}
.uhead img{width:64px;height:64px;image-rendering:auto;border-radius:8px;background:#0a0f28;border:1px solid var(--rule)}
.tier{font-size:13px;letter-spacing:.06em}
.quote{margin:10px 0 0;padding:8px 10px;border-left:3px solid var(--star);background:#101945;border-radius:0 6px 6px 0;font-size:14px;line-height:1.5}
.state{margin:8px 0 0;font-size:13px;color:var(--sky)}
.atk{margin:6px 0 0;font-size:13px;color:var(--dim);line-height:1.45}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0;font-size:13px}
.stats dt{color:var(--dim)}
.stats dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.btn{background:#17224f;border:1px solid #31428a;border-radius:8px;padding:7px 11px;font-size:13px;line-height:1.25}
.btn:hover:not(:disabled){border-color:#6a84d8}
.btn.up{border-color:#8a6a1c;background:#2a2410;color:#ffe9a6}
.btn.fuse{border-color:#2f8a64;background:#0f2d24;color:#c9ffe6;width:100%;margin-top:8px}
.btn.warn{border-color:#8a3040;background:#2c1018;color:#ffc9cf}
.rc{padding:10px;border:1px solid var(--rule);border-radius:9px;background:#0e1538}
.rc+.rc{margin-top:8px}
.rc.ready{border-color:#2f8a64;background:#0d2228}
.rc-h{display:flex;align-items:center;gap:8px}
.rc-h img{width:32px;height:32px;image-rendering:auto}
.rc-h b{font-family:var(--f-disp);font-weight:400;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chip{display:inline-block;padding:2px 7px;border-radius:5px;font-size:12px;line-height:1.5;border:1px solid var(--rule);background:#121a44}
.chip.have{border-color:#2f8a64;color:#bff5dc;background:#0f2a24}
.chip.need{color:#aab3d8;border-style:dashed}
.note{margin:8px 0 0;font-size:12px;color:var(--dim)}
.note.warn{color:#ffc58a}
.guide ol{margin:8px 0 0;padding-left:20px;line-height:1.6}
.guide li{margin-bottom:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px}
.hint{line-height:1.55}
.ok{color:var(--fuse)}

/* Veil */
.veil{position:absolute;inset:0;display:flex;padding:16px;background:rgba(5,8,26,.9);overflow:auto}
.veil-box{max-width:500px;margin:auto;text-align:center}
.veil-box h2{margin:4px 0 10px;font-family:var(--f-disp);font-weight:400;font-size:clamp(30px,6vw,44px);line-height:1.05;text-wrap:balance}
.veil-box h2 span{color:var(--star)}
.veil-box p{margin:6px 0;line-height:1.55;color:#c9d0f2}
.rules{display:grid;gap:7px;margin:12px auto 14px;padding:0;list-style:none;text-align:left;font-size:13px;line-height:1.55;color:#c9d0f2}
.rules li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px}
.rules b{color:var(--star);font-weight:700}
.go{margin-top:6px;padding:10px 26px;border:0;border-radius:10px;background:var(--star);color:#1b1404;font-family:var(--f-disp);font-size:22px}
.go:hover{filter:brightness(1.08)}
.best{font-size:12px;color:var(--dim)}

/* Codex */
.codex{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:rgba(3,5,16,.82);overflow:auto}
.reward-box{max-width:900px}
.rw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:14px}
.rw-card{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:10px;border:1px solid var(--rule);border-radius:9px;background:#0e1538}
.rw-card:hover{border-color:var(--star)}
.rw-card img{width:48px;height:48px}
.rw-card b{display:block;font-family:var(--f-disp);font-weight:400;font-size:18px;line-height:1.15}
.rw-card span{display:block;font-size:12px;color:var(--dim);line-height:1.35;margin-top:2px}
.rw-btn{position:absolute;left:10px;bottom:10px;padding:8px 14px;border:1px solid var(--star);border-radius:999px;background:rgba(42,32,8,.92);color:#ffe9a6;font-family:var(--f-disp);font-size:17px;animation:dangerPulse .9s ease-in-out infinite alternate}
.codex-box{width:100%;max-width:1040px;padding:18px;border:1px solid var(--rule);border-radius:12px;background:var(--deck)}
.codex-top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.codex-top h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:28px}
.codex-top p{margin:4px 0 0;color:var(--dim);font-size:13px}
.ctier{margin:20px 0 8px;font-family:var(--f-disp);font-weight:400;font-size:20px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:8px}
.cx{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;padding:10px;border:1px solid var(--rule);border-radius:9px;background:#0e1538}
.cx img{width:48px;height:48px;image-rendering:auto}
.cx h4{margin:0;font-family:var(--f-disp);font-weight:400;font-size:19px}
.cx q{display:block;margin:4px 0 0;font-size:13px;line-height:1.45;quotes:"“" "”"}
.cx .atk{font-size:12px}
.cx .upg{margin:4px 0 0;font-size:12px;color:#ffe9a6}
.cx .chips{margin-top:6px}
.plus{color:var(--dim);font-size:12px;align-self:center}

/* 4.5성 반 개 별 */
.half{-webkit-text-fill-color:rgba(255,255,255,.2);position:relative;display:inline-block}
.half::before{content:"★";position:absolute;left:0;top:0;width:50%;overflow:hidden;-webkit-text-fill-color:currentColor}
/* 관리자 */
.admin{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 12px;border:1px solid #7a5a1c;border-radius:10px;background:#1a1508}
.atag{font-family:var(--f-disp);font-weight:400;font-size:18px;color:var(--star);margin-right:4px}
.agrp{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--dim)}
.admin input,.admin select{background:#0e1636;border:1px solid var(--rule);border-radius:7px;color:var(--ink);padding:4px 6px;font:inherit;font-size:13px}
.admin input{width:62px}
.login-box{max-width:400px;margin-top:10vh}
.ltitle{margin:0;font-family:var(--f-disp);font-weight:400;font-size:26px}
.lform{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.lform input{flex:1;min-width:140px;background:#0e1636;border:1px solid var(--rule);border-radius:7px;color:var(--ink);padding:7px 9px;font:inherit}
/* 가로 화면 모드: 상점을 오른쪽 줄로 옮겨 전장을 세로 끝까지 키움 */
.landscape .app{padding-block:6px;gap:6px}
.landscape .hud{flex-direction:column;flex-wrap:nowrap;align-items:stretch;width:132px;flex:none;gap:12px;padding:12px 10px;align-self:stretch}
.landscape .brand{font-size:22px;line-height:1.1;white-space:normal}
.landscape .brand span{display:block}
.landscape .hstat{flex-wrap:wrap;gap:0 5px;padding-top:8px;border-top:1px solid var(--rule)}
.landscape .hstat .lab{width:100%;margin-bottom:1px}
.landscape .num{font-size:20px}
.landscape .hstat .mini{margin-top:4px}
.landscape .tools{margin-left:0;margin-top:auto;flex-direction:column;gap:5px}
.landscape .tools .tbtn{width:100%;padding:6px 4px}
.landscape .stage{gap:10px}
.landscape .field{gap:6px}
.landscape .card{min-height:70px;padding:5px 4px;row-gap:1px}
.landscape .card img{width:30px;height:30px}
.landscape .cn{font-size:16px}
.landscape .side{gap:4px}
.landscape .reroll,.landscape .atk-up{padding-block:2px;gap:0}
.landscape .atk-up .al1{font-size:11px}
.landscape .atk-up .al2{font-size:14px}
.landscape .empty-shop{min-height:70px}
.landscape .panel{padding:10px 12px;font-size:13px}
.landscape .panel h2{font-size:21px}
.landscape .uhead{grid-template-columns:44px minmax(0,1fr);gap:8px}
.landscape .uhead img{width:44px;height:44px}
.landscape .quote{margin-top:6px;padding:6px 8px;font-size:13px}
.landscape .stats{margin-top:6px;font-size:12px}
.landscape .acts{margin-top:8px}
.landscape .btn{padding:6px 9px;font-size:12px}
.landscape .rc{padding:8px}
.landscape .rc-h b{font-size:16px}
.landscape .panel h3{margin:10px 0 6px}
@media (max-width:899px){
  .stage{flex-direction:column;align-items:center}
  .field{width:100%;align-items:center}
  .panel{width:100%;max-width:640px}
  .rail{width:100%;max-width:640px}
  .landscape .stage{flex-direction:row;align-items:flex-start}
  .landscape .field{width:auto}
  .tools{margin-left:0}
}
@media (max-width:560px){
  .shop{grid-template-columns:repeat(4,minmax(0,1fr)) 72px;gap:4px}
  .atk-up{padding:4px 2px}
  .atk-up .al1{font-size:10.5px}
  .atk-up .al2{font-size:14px}
  .atk-up .al3{font-size:9.5px;letter-spacing:-.02em}
  .cn{font-size:13px!important;white-space:normal!important;word-break:keep-all}
  .card{min-height:84px;padding:6px 2px}
  .card img{width:34px!important;height:34px!important}
  .atk-up,.reroll{font-size:12px}
  .card{padding:6px 2px}
  .card img{width:40px;height:40px}
  .cn{font-size:15px}
  .ck{font-size:11px}
  .brand{font-size:20px}
}
@media (prefers-reduced-motion:reduce){
  .danger,.vignette,.rw-btn{animation:none}
  .card,.toast,.meter i{transition:none}
}
</style>

<div class="app">
  <header class="hud">
    <h1 class="brand">별과 우주 <span>디펜스</span></h1>
    <div class="hstat"><span class="lab">웨이브</span><b class="num" id="hWave">0</b><span class="sub">/ 80</span></div>
    <div class="hstat"><span class="lab" id="hTimerLab">다음 웨이브</span><b class="num" id="hTimer">–</b><span class="sub">초</span></div>
    <div class="hstat"><span class="lab">맵 위의 적</span><b class="num" id="hFoes">0</b><span class="sub">/ 100</span></div>
    <div class="hstat res"><span class="gem" aria-hidden="true"></span><b class="num" id="hStars">0</b><span class="sub">스타</span></div>
    <div class="tools">
      <button class="tbtn" id="btnPause" type="button">일시정지</button>
      <button class="tbtn on" id="btnMusic" type="button">음악</button>
      <button class="tbtn on" id="btnSfx" type="button">효과음</button>
      <button class="tbtn" id="btnCodex" type="button">조합표</button>
      <button class="tbtn" id="btnAdmin" type="button">관리자</button>
    </div>
  </header>
  <section class="admin" id="admin" hidden aria-label="관리자 도구">
    <b class="atag">관리자 모드</b>
    <div class="seg" id="speed" role="group" aria-label="게임 속도"><button class="tbtn on" data-s="1" type="button">1×</button><button class="tbtn" data-s="2" type="button">2×</button><button class="tbtn" data-s="3" type="button">3×</button><button class="tbtn" data-s="5" type="button">5×</button></div>
    <button class="tbtn" data-ad="star5" type="button">스타 +5</button>
    <button class="tbtn" data-ad="star50" type="button">스타 +50</button>
    <button class="tbtn" data-ad="next" type="button">다음 웨이브</button>
    <span class="agrp"><label for="adWave">웨이브</label><input id="adWave" type="number" min="1" max="80" value="10"><button class="tbtn" data-ad="goto" type="button">이동</button></span>
    <button class="tbtn" data-ad="boss" type="button">보스 소환</button>
    <button class="tbtn" data-ad="clear" type="button">적 모두 제거</button>

    const o = G.grid[ty][tx]; if (o === u) { G.mode = null; refreshUI(); return; }
    G.grid[u.y][u.x] = o; if (o) { o.x = u.x; o.y = u.y; }
    u.x = tx; u.y = ty; G.grid[ty][tx] = u; G.mode = null; AU.sfx('place'); refreshUI(); return;
  }
  G.sel = isBuild(tx, ty) ? G.grid[ty][tx] : null; G.sellArm = 0; renderPanel();
});
cv.addEventListener('mousemove', ev => { G.hover = tileAt(ev); });
cv.addEventListener('mouseleave', () => { G.hover = null; });
$('#cards').addEventListener('click', ev => {
  const b = ev.target.closest('.card'); if (!b || b.disabled || G.state !== 'play') return; const i = +b.dataset.i, c = G.shop[i];
  if (G.mode === 'place' && G.placeCard === i) { G.mode = null; refreshUI(); return; }
  if (G.stars < 1) { toast('스타가 부족해요.'); AU.sfx('err'); return; }
  if (!emptyTile()) { toast('빈 자리가 없어요. 조합하거나 판매해서 자리를 만드세요.', 'alarm'); AU.sfx('err'); return; }
  G.mode = 'place'; G.free = false; G.placeId = c.id; G.placeCard = i; G.sel = null; AU.sfx('buy'); refreshUI();
});
$('#btnAtk').addEventListener('click', () => {
  if (G.state !== 'play' || G.atk >= ATK_MAX) return; const c = atkCost(G.atk); if (G.stars < c) { toast('스타가 부족해요.'); AU.sfx('err'); return; }
  G.stars -= c; G.atk++; AU.sfx('up'); toast(`전체 공격력 +${G.atk * 2}%`, 'gold');
  for (const u of G.units) addFx({k: 'ring', x: u.x + .5, y: u.y + .5 - LIFT, r0: .1, r1: .45, dur: .4, col: '#ffd45e', w: .04});
  refreshUI();
});
$('#rwGrid').addEventListener('click', ev => { const b = ev.target.closest('.rw-card'); if (!b) return;
  if (!emptyTile()) { toast('빈칸이 없어요. 유닛을 판매하거나 조합해서 자리를 만든 뒤 받으세요.', 'alarm'); AU.sfx('err'); return; }
  closeReward(); G.mode = 'place'; G.free = true; G.rewardPlace = true; G.placeId = b.dataset.id; G.placeCard = -1; G.sel = null; AU.sfx('buy'); syncRewardBtn(); refreshUI(); });
$('#rwLater').addEventListener('click', closeReward);
$('#rwBtn').addEventListener('click', () => { AU.init(); openReward(); });
$('#btnReroll').addEventListener('click', () => { if (G.state !== 'play') return; if (G.freeRR > 0) G.freeRR--; else if (G.stars >= 1) G.stars--; else return; rollShop(); AU.sfx('buy'); refreshUI(); });
$('#panel').addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return; const act = b.dataset.act, u = G.sel;
  if (act === 'cancel') { G.mode = null; G.free = false; G.rewardPlace = false; syncRewardBtn(); refreshUI(); return; }
  if (!u || G.state !== 'play') return;
  const D = U[u.id];
  if (act === 'up') { upgrade(u, false); refreshUI(); }
  else if (act === 'move') { G.mode = 'move'; refreshUI(); }
  else if (act === 'sell') { G.sellArm = u.uid; renderPanel(); }
  else if (act === 'sell2') { removeUnit(u); G.sellArm = 0; refreshUI(); }
  else if (act === 'fuse') { const rid = b.dataset.id, R = U[rid], as = findMat(R.rec, u); if (!as.every(Boolean)) return;
    const x = u.x, y = u.y; for (const v of as) removeUnit(v); const nu = addUnit(rid, x, y); G.sel = nu; AU.sfx('fuse');
    addFx({k: 'ring', x: x + .5, y: y + .5 - LIFT, r0: .1, r1: 1.1, dur: .7, col: TCOL[R.t], w: .08, fill: true});
    addFx({k: 'txt', x: x + .5, y: y + .2, txt: R.n, dur: 1.4, col: TCOL[R.t]});
    toast(`${R.n} 탄생! (${R.t}성)`, 'ok'); refreshUI(); }
});
function setSpeed(s) { G.speed = s; document.querySelectorAll('#speed .tbtn').forEach(b => b.classList.toggle('on', +b.dataset.s === s)); }
$('#speed').addEventListener('click', ev => { const b = ev.target.closest('[data-s]'); if (b && ADMIN) setSpeed(+b.dataset.s); });
function setPause(p) { G.paused = p; $('#btnPause').textContent = p ? '계속하기' : '일시정지'; $('#btnPause').classList.toggle('on', p); }
$('#btnPause').addEventListener('click', () => { if (G.state === 'play') setPause(!G.paused); });
$('#btnMusic').addEventListener('click', e => { AU.init(); AU.setMusic(!AU.music); e.currentTarget.classList.toggle('on', AU.music); });
$('#btnSfx').addEventListener('click', e => { AU.init(); AU.setFx(!AU.fx); e.currentTarget.classList.toggle('on', AU.fx); });
let codexBuilt = false, codexWasPaused = false;
function openCodex() { if (!codexBuilt) { buildCodex(); codexBuilt = true; } codexWasPaused = G.paused; if (G.state === 'play') setPause(true); $('#codex').hidden = false; $('#btnCodexClose').focus(); }
function closeCodex() { $('#codex').hidden = true; if (G.state === 'play') setPause(codexWasPaused); }
$('#btnCodex').addEventListener('click', openCodex);
$('#btnCodexClose').addEventListener('click', closeCodex);
$('#codex').addEventListener('click', ev => { if (ev.target.id === 'codex') closeCodex(); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !$('#login').hidden) { $('#login').hidden = true; return; }
  if (ev.target.matches && ev.target.matches('input,select,textarea')) return;
  if (ev.key === 'Escape') { if (!$('#reward').hidden) return closeReward(); if (!$('#codex').hidden) return closeCodex(); if (G.mode) { G.mode = null; G.free = false; G.rewardPlace = false; syncRewardBtn(); refreshUI(); } else if (G.sel) { G.sel = null; renderPanel(); } return; }
  if (ev.target.closest && ev.target.closest('button') && (ev.key === ' ' || ev.key === 'Enter')) return;
  if (ev.key === ' ' && G.state === 'play') { ev.preventDefault(); setPause(!G.paused); }
  if (ADMIN && ['1', '2', '3', '5'].includes(ev.key)) setSpeed(+ev.key);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play' && !G.paused) setPause(true); });

function upgrade(u, free) {
  const D = U[u.id]; if (!D.up || u.lv >= D.up.max) return false;
  if (!free) { if (G.stars < D.up.cost) return false; G.stars -= D.up.cost; }
  u.lv++; AU.sfx('up'); addFx({k: 'ring', x: u.x + .5, y: u.y + .5 - LIFT, r0: .1, r1: .55, dur: .45, col: '#ffd45e', w: .06});
  if (D.evo && u.lv >= D.up.max) {
    const x = u.x, y = u.y, E = U[D.evo]; removeUnit(u); G.sel = addUnit(D.evo, x, y); AU.sfx('fuse');
    addFx({k: 'ring', x: x + .5, y: y + .5 - LIFT, r0: .1, r1: 1.3, dur: .8, col: TCOL[E.t], w: .09, fill: true}); addFx({k: 'txt', x: x + .5, y: y + .2, txt: E.n, dur: 1.5, col: TCOL[E.t]});
    toast(`${D.n} → ${E.n} 진화! (${E.t}성)`, 'ok');
  } else toast(D.st === 'temp' ? `${D.n} 표면 온도 ${(D.base + D.step * u.lv).toLocaleString('ko-KR')}도!` : `${D.n} 밝기 ${D.base - u.lv}등급!`, 'gold');
  return true;
}

/* ───────── 관리자 모드 ───────── */
let ADMIN = false;
function syncAdmin() {
  const a = $('#adGod'), b = $('#adFreeze');
  a.textContent = `무적 ${G.god ? '켬' : '끔'}`; a.classList.toggle('on', !!G.god);
  b.textContent = `타이머 정지 ${G.freeze ? '켬' : '끔'}`; b.classList.toggle('on', !!G.freeze);
}
function setAdmin(on) {
  ADMIN = on; $('#admin').hidden = !on; const b = $('#btnAdmin'); b.classList.toggle('on', on); b.textContent = on ? '관리자 켜짐' : '관리자';
  if (!on) { setSpeed(1); G.god = false; G.freeze = false; if (G.free) { G.free = false; G.mode = null; refreshUI(); } }
  syncAdmin(); layout();
}
$('#adUnit').innerHTML = TIERS.map(t => `<optgroup label="${t}성">${Object.keys(U).filter(id => U[id].t === t).map(id => `<option value="${id}">${U[id].n}</option>`).join('')}</optgroup>`).join('');
$('#btnAdmin').addEventListener('click', () => {
  if (ADMIN) { setAdmin(false); toast('관리자 모드를 껐어요.'); return; }
  $('#loginMsg').textContent = ''; $('#pw').value = ''; $('#login').hidden = false; $('#pw').focus();
});
$('#loginForm').addEventListener('submit', ev => {
  ev.preventDefault();
  if ($('#pw').value.trim() === ADMIN_PW) { $('#login').hidden = true; setAdmin(true); toast('관리자 모드가 켜졌어요.', 'gold'); }
  else { $('#loginMsg').textContent = '비밀번호가 맞지 않아요.'; $('#pw').select(); }
});
$('#loginCancel').addEventListener('click', () => { $('#login').hidden = true; });
$('#login').addEventListener('click', ev => { if (ev.target.id === 'login') $('#login').hidden = true; });
$('#admin').addEventListener('click', ev => {
  const b = ev.target.closest('[data-ad]'); if (!b || !ADMIN) return; const a = b.dataset.ad;
  if (a === 'off') { setAdmin(false); toast('관리자 모드를 껐어요.'); return; }
  if (a === 'god') { G.god = !G.god; syncAdmin(); return; }
  if (a === 'freeze') { G.freeze = !G.freeze; syncAdmin(); hud(); return; }
  if (G.state !== 'play') { toast('게임을 시작한 뒤에 쓸 수 있어요.'); return; }
  if (a === 'star5') G.stars += 5;
  else if (a === 'star50') G.stars += 50;
  else if (a === 'next') { if (G.wave < MAXW) startWave(); }
  else if (a === 'goto') { const n = clamp(parseInt($('#adWave').value, 10) || 1, 1, MAXW); G.wave = n - 1; startWave(); }
  else if (a === 'boss') { const e = spawnEnemy(true); AU.sfx('boss'); toast(`보스 「${e.name}」 소환 (${BOSST[e.trait].n})`, 'alarm'); }
  else if (a === 'clear') { for (const e of G.enemies) e.dead = true; G.enemies.length = 0; G.proj.length = 0; G.fields.length = 0; toast('맵 위의 적을 모두 지웠어요.'); }
  else if (a === 'spawn') { if (!emptyTile()) { toast('빈칸이 없어요.'); return; } G.mode = 'place'; G.free = true; G.placeId = $('#adUnit').value; G.placeCard = -1; G.sel = null; }
  else if (a === 'maxup') { let u = G.sel; if (!u) { toast('먼저 맵 위의 유닛을 선택하세요.'); return; } if (!U[u.id].up) { toast('업그레이드가 없는 유닛이에요.'); return; } while (u && upgrade(u, true)) u = G.units.includes(u) ? u : null; }
  refreshUI();
});

/* ───────── 루프 ───────── */
let last = performance.now();
function frame(now) {
  const raw = (now - last) / 1000, dt = Math.min(.1, raw); last = now;
  if (raw < .5) { frameAvg += (raw - frameAvg) * .05;
    if (frameAvg > 1 / 38) { slowFor += raw; fastFor = 0; } else if (frameAvg < 1 / 56) { fastFor += raw; slowFor = 0; }
    if (!LOW && slowFor > .5) { LOW = true; slowFor = 0; }
    else if (LOW && RES === 1 && slowFor > 3) { RES = .7; slowFor = 0; frameAvg = 1 / 50; W = 0; layout(); }
    else if (RES < 1 && !SKIP && slowFor > 3) { SKIP = true; slowFor = 0; frameAvg = 1 / 50; }
    else if (SKIP && fastFor > 8) { SKIP = false; fastFor = 0; }
    else if (RES < 1 && !SKIP && fastFor > 12) { RES = 1; fastFor = 0; W = 0; layout(); }
    else if (LOW && RES === 1 && fastFor > 4) { LOW = false; fastFor = 0; } }
  if (G.state === 'play' && !G.paused) { let total = dt * BASE * G.speed, steps = 0; const maxSteps = 4 + G.speed * 2;
    while (total > 1e-4 && G.state === 'play' && steps++ < maxSteps) { const st = Math.min(1 / 30, total); update(st); total -= st; } }
  if (G.dirty) { G.dirty = false; refreshUI(); }
  const idle = G.state !== 'play' || G.paused;
  if (idle ? (fc++ % 6) === 0 : (!SKIP || (fc++ & 1) === 0)) render(now);
  if (G.state === 'play' || G.state === 'over') hud();
  requestAnimationFrame(frame);
}

/* ───────── 시작 ───────── */
function titleVeil() {
  const best = bestWave();
  $('#veil').innerHTML = `<div class="veil-box">
    <p class="eyebrow">중학교 2학년 과학 · 8. 별과 우주 복습</p>
    <h2>별과 우주 <span>디펜스</span></h2>
    <p>절벽 위에 천체 유닛을 세워 협곡을 도는 우주 괴물을 막아요.</p>
    <ul class="rules">
      <li><b>목표</b><span>적이 100마리를 넘지 않게 80웨이브 버티기</span></li>
      <li><b>방법</b><span>카드로 유닛을 사서 설치하고, 강화·조합으로 진화</span></li>
      <li><b>보스</b><span>10웨이브마다 등장</span></li>
    </ul>
    <button class="go" id="btnStart" type="button">게임 시작</button>
    <p class="best">${best ? `최고 기록: 웨이브 ${best} · ` : ''}음악은 게임 시작과 함께 재생돼요</p></div>`;
  $('#btnStart').onclick = startGame;
}
reset(); titleVeil(); refreshUI();
layout(); addEventListener('resize', () => { layout(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const k in iconCache) delete iconCache[k]; buildSprites(); refreshUI(); });
requestAnimationFrame(frame);
})();
</script>
